name: Dependency Consistency Check

on:
  pull_request:
    paths:
      - "packages/akshare-mcp/pyproject.toml"
      - "packages/akshare-mcp/requirements.txt"
      - "packages/akshare-mcp/setup.py"
      - "packages/akshare-mcp/scripts/check_dependency_consistency.py"
      - ".github/workflows/dependency-consistency.yml"
  push:
    branches: ["master", "main"]
    paths:
      - "packages/akshare-mcp/pyproject.toml"
      - "packages/akshare-mcp/requirements.txt"
      - "packages/akshare-mcp/setup.py"
      - "packages/akshare-mcp/scripts/check_dependency_consistency.py"
      - ".github/workflows/dependency-consistency.yml"

jobs:
  dependency-consistency:
    name: check requirements.txt vs pyproject.toml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dependency consistency check
        run: |
          python packages/akshare-mcp/scripts/check_dependency_consistency.py

