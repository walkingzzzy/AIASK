name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Type check
        run: npm run typecheck --workspaces --if-present

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build BFF
        run: npm run build -w apps/bff

      - name: Build Web
        run: npm run build -w apps/web

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/akshare-mcp/requirements.txt
          pip install akshare baostock efinance pytest
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: Run JS tests
        run: npm test

      - name: Run Python tests
        env:
          PYTHONPATH: packages/akshare-mcp/src:packages/strategy-factory/src
        run: |
          pytest packages/akshare-mcp/tests/ -q --ignore=packages/akshare-mcp/tests/archive --ignore=packages/akshare-mcp/tests/real_world_scenarios --ignore=packages/akshare-mcp/tests/tushare-pro -x
          pytest packages/strategy-factory/tests/ -q -x

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install MCP Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/akshare-mcp/requirements.txt
          pip install akshare baostock efinance
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e:ci
        env:
          CI: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy notification
        run: echo "🚀 Deployment triggered for main branch"
        # Add actual deployment steps here (Docker, Vercel, etc.)
