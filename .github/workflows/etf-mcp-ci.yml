name: etf-mcp-ci

on:
  push:
    paths:
      - "packages/etf-mcp/**"
  pull_request:
    paths:
      - "packages/etf-mcp/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/etf-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Compile check
        run: python -m compileall src/etf_mcp

      - name: Run tests
        run: python -m pytest -q tests

