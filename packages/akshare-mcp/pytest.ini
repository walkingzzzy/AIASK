[pytest]
testpaths = tests
pythonpath =
    src
    ../strategy-factory/src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    benchmark: marks tests as benchmark tests
    asyncio: legacy asyncio-style async tests
    anyio: tests executed via pytest-anyio

norecursedirs =
    tests/archive
    tests/data-quality
    tests/tushare-pro
    tests/__pycache__
    __pycache__
    .pytest_cache
    .benchmarks
    htmlcov
