[pytest]
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --benchmark-disable
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    benchmark: marks tests as benchmark tests

norecursedirs =
    tests/archive
    tests/__pycache__
    __pycache__
    .pytest_cache
    .benchmarks
    htmlcov
