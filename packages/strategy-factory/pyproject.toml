[project]
name = "strategy-factory"
version = "0.1.0"
description = "Strategy Factory facade and migration package"
requires-python = ">=3.12"
dependencies = [
    "aiask-quant-core",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.25.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_factory"]

[tool.uv.sources]
aiask-quant-core = { path = "../aiask-quant-core", editable = true }
