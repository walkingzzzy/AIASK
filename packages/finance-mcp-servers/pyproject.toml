[project]
name = "aiask-finance-mcp-servers"
version = "0.1.0"
description = "AIASK 金融软件 MCP Server 集合 — 通达信、同花顺、东方财富、QMT"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AIASK Team" }]

dependencies = [
    "mcp>=1.0.0",
    "pytdx>=1.72",
    "efinance>=0.4.0",
]

[project.optional-dependencies]
tongdaxin = ["pytdx>=1.72"]
tonghuashun = ["easytrader>=0.22"]
eastmoney = ["efinance>=0.4.0"]
qmt = []
all = ["pytdx>=1.72", "easytrader>=0.22", "efinance>=0.4.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
aiask-finance-tdx = "aiask_finance_mcp.tongdaxin.server:main"
aiask-finance-ths = "aiask_finance_mcp.tonghuashun.server:main"
aiask-finance-em = "aiask_finance_mcp.eastmoney.server:main"
aiask-finance-qmt = "aiask_finance_mcp.qmt.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiask_finance_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
