global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: aiask-bff
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - host.docker.internal:3001

  - job_name: aiask-bff-health
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://host.docker.internal:3001/api/health/live
          - http://host.docker.internal:3001/api/health/ready
          - http://host.docker.internal:3001/api/health/startup
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115
