groups:
  - name: aiask-agent-readiness
    rules:
      - alert: AiaskAgentHealthProbeFailed
        expr: probe_success{job="aiask-agent-health", instance="http://host.docker.internal:8766/health"} == 0
        for: 2m
        labels:
          severity: critical
          surface: agent-health
        annotations:
          summary: "AIASK Agent health probe is failing"
          description: "Prometheus cannot get a successful response from /health."

      - alert: AiaskAgentDetailedHealthProbeFailed
        expr: probe_success{job="aiask-agent-health", instance="http://host.docker.internal:8766/health/detailed"} == 0
        for: 5m
        labels:
          severity: warning
          surface: agent-health
        annotations:
          summary: "AIASK Agent detailed health probe is failing"
          description: "Prometheus cannot get a successful response from /health/detailed."
