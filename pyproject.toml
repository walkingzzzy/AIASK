[project]
name = "desktop-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.104.0", "uvicorn>=0.24.0", "pydantic>=2.5.0", "aiosqlite>=0.19.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
