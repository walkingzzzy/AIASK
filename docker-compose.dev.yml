name: aiask-dev

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: akshare-timescaledb
    shm_size: ${POSTGRES_CONTAINER_SHM_SIZE:-2gb}
    mem_limit: ${POSTGRES_CONTAINER_MEM_LIMIT:-4g}
    cpus: ${POSTGRES_CONTAINER_CPUS:-2.0}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1024MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - autovacuum_work_mem=${POSTGRES_AUTOVACUUM_WORK_MEM:-64MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-30}
      - -c
      - max_parallel_maintenance_workers=${POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS:-1}
      - -c
      - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-2}
      - -c
      - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-1}
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-8}
      - -c
      - timescaledb.max_background_workers=${POSTGRES_TIMESCALE_MAX_BACKGROUND_WORKERS:-4}
      - -c
      - huge_pages=${POSTGRES_HUGE_PAGES:-off}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockdb}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiask-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  akshare-mcp:
    image: ${AKSHARE_MCP_IMAGE:-aiask-akshare-mcp:local}
    build:
      context: .
      dockerfile: packages/akshare-mcp/Dockerfile
    container_name: akshare-mcp
    ports:
      - "127.0.0.1:${MCP_PORT:-3100}:${MCP_PORT:-3100}"
    environment:
      MCP_TRANSPORT: streamable-http
      AKSHARE_MCP_STARTUP_PROFILE: ${AKSHARE_MCP_STARTUP_PROFILE:-worker}
      MCP_HOST: ${MCP_CONTAINER_HOST:-0.0.0.0}
      MCP_PORT: ${MCP_PORT:-3100}
      MCP_CONTAINER_BIND_ALL: ${MCP_CONTAINER_BIND_ALL:-true}
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-127.0.0.1}
      MCP_PUBLIC_PORT: ${MCP_PORT:-3100}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1:3100,localhost:3100,akshare-mcp:3100}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-bearer}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-change_me_mcp_token}
      MCP_ALLOW_TOKEN_PASSTHROUGH: ${MCP_ALLOW_TOKEN_PASSTHROUGH:-false}
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-stockdb}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      AKSHARE_MCP_DB_POOL_MIN: ${AKSHARE_MCP_DB_POOL_MIN:-1}
      AKSHARE_MCP_DB_POOL_MAX: ${AKSHARE_MCP_DB_POOL_MAX:-2}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, socket; s=socket.create_connection(('127.0.0.1', int(os.getenv('MCP_PORT', '3100'))), 3); s.close()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: akshare-pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aiask.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    profiles: ["monitoring"]
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    container_name: aiask-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./monitoring/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  postgres-exporter:
    profiles: ["monitoring"]
    image: ${POSTGRES_EXPORTER_IMAGE:-quay.io/prometheuscommunity/postgres-exporter:latest}
    container_name: aiask-postgres-exporter
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/${POSTGRES_DB:-stockdb}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    volumes:
      - ./monitoring/postgres-exporter-queries.yml:/etc/postgres-exporter/queries.yml:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  blackbox-exporter:
    profiles: ["monitoring"]
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:latest}
    container_name: aiask-blackbox-exporter
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    ports:
      - "${BLACKBOX_EXPORTER_PORT:-9115}:9115"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

  alertmanager:
    profiles: ["monitoring"]
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:latest}
    container_name: aiask-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: aiask-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
      - postgres-exporter
      - blackbox-exporter
    restart: unless-stopped

volumes:
  timescaledb-data:
    driver: local
    name: akshare-timescaledb-data
  redis-data:
    driver: local
    name: aiask-redis-data
  pgadmin-data:
    driver: local
    name: akshare-pgadmin-data
  prometheus-data:
    driver: local
    name: aiask-prometheus-data
  alertmanager-data:
    driver: local
    name: aiask-alertmanager-data
