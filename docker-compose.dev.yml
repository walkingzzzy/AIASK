name: aiask-dev

x-akshare-runtime-env: &akshare-runtime-env
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONWARNINGS: ${PYTHONWARNINGS:-ignore::ResourceWarning}
  TQDM_DISABLE: ${TQDM_DISABLE:-1}
  AKSHARE_MCP_SUPPRESS_RESOURCE_WARNINGS: ${AKSHARE_MCP_SUPPRESS_RESOURCE_WARNINGS:-true}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
  TUSHARE_HTTP_URL: ${TUSHARE_HTTP_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DB_HOST: timescaledb
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-postgres}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  DB_NAME: ${POSTGRES_DB:-stockdb}
  REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
  AKSHARE_MCP_DB_POOL_MIN: ${AKSHARE_MCP_DB_POOL_MIN:-1}
  AKSHARE_MCP_DB_POOL_MAX: ${AKSHARE_MCP_DB_POOL_MAX:-2}
  STRATEGY_MARKET_TIMEZONE: ${STRATEGY_MARKET_TIMEZONE:-Asia/Shanghai}
  STRATEGY_EMBEDDING_ENABLED: ${STRATEGY_EMBEDDING_ENABLED:-1}
  STRATEGY_EMBEDDING_PROVIDER: ${STRATEGY_EMBEDDING_PROVIDER:-hash_fallback}
  STRATEGY_EMBEDDING_BASE_URL: ${STRATEGY_EMBEDDING_BASE_URL:-}
  STRATEGY_EMBEDDING_API_KEY: ${STRATEGY_EMBEDDING_API_KEY:-}
  STRATEGY_EMBEDDING_MODEL: ${STRATEGY_EMBEDDING_MODEL:-text-embedding-3-small}
  STRATEGY_EMBEDDING_ALLOW_HASH_FALLBACK: ${STRATEGY_EMBEDDING_ALLOW_HASH_FALLBACK:-1}
  STARTUP_EMBEDDING_CHECK_ENABLED: ${STARTUP_EMBEDDING_CHECK_ENABLED:-0}
  VECTOR_INDEX_BUILD_MAINTENANCE_WORK_MEM: ${VECTOR_INDEX_BUILD_MAINTENANCE_WORK_MEM:-256MB}
  VECTOR_INDEX_BUILD_MAX_PARALLEL_MAINTENANCE_WORKERS: ${VECTOR_INDEX_BUILD_MAX_PARALLEL_MAINTENANCE_WORKERS:-1}
  FACTOR_SCHEDULER_LLM_MINING: ${FACTOR_SCHEDULER_LLM_MINING:-1}
  STRATEGY_FACTORY_STATUS_SOURCE: ${STRATEGY_FACTORY_STATUS_SOURCE:-db}
  STRATEGY_FACTORY_SCHEDULE_MODE: ${STRATEGY_FACTORY_SCHEDULE_MODE:-continuous}
  STRATEGY_FACTORY_MAX_RESEARCH_TASKS: ${STRATEGY_FACTORY_MAX_RESEARCH_TASKS:-12}
  STRATEGY_FACTORY_MAX_BULK_RESEARCH_TASKS: ${STRATEGY_FACTORY_MAX_BULK_RESEARCH_TASKS:-20}
  STRATEGY_FACTORY_CANDIDATES_PER_TASK: ${STRATEGY_FACTORY_CANDIDATES_PER_TASK:-4}
  STRATEGY_FACTORY_TASK_HARD_CAP: ${STRATEGY_FACTORY_TASK_HARD_CAP:-24}
  STRATEGY_FACTORY_RESEARCH_TASK_CONCURRENCY: ${STRATEGY_FACTORY_RESEARCH_TASK_CONCURRENCY:-5}
  STRATEGY_FACTORY_PRE_GATE_ENABLED: ${STRATEGY_FACTORY_PRE_GATE_ENABLED:-true}
  STRATEGY_FACTORY_SPAWNER_TARGET_TOTAL: ${STRATEGY_FACTORY_SPAWNER_TARGET_TOTAL:-20}
  STRATEGY_FACTORY_SPAWNER_FILL_BUDGET_MAX: ${STRATEGY_FACTORY_SPAWNER_FILL_BUDGET_MAX:-10}
  STRATEGY_FACTORY_SPAWNER_EVENT_FILL_BUDGET_MAX: ${STRATEGY_FACTORY_SPAWNER_EVENT_FILL_BUDGET_MAX:-3}
  STRATEGY_FACTORY_SPAWNER_EVENT_SOURCE_BASE_CAP: ${STRATEGY_FACTORY_SPAWNER_EVENT_SOURCE_BASE_CAP:-1}
  STRATEGY_FACTORY_SPAWNER_EVENT_SOURCE_SUPPLEMENTAL_BONUS: ${STRATEGY_FACTORY_SPAWNER_EVENT_SOURCE_SUPPLEMENTAL_BONUS:-1}
  STRATEGY_FACTORY_BULK_STOCK_MATRIX_ENABLED: ${STRATEGY_FACTORY_BULK_STOCK_MATRIX_ENABLED:-false}
  STRATEGY_FACTORY_BULK_STOCK_MATRIX_UNIVERSE_LIMIT: ${STRATEGY_FACTORY_BULK_STOCK_MATRIX_UNIVERSE_LIMIT:-5000}
  STRATEGY_FACTORY_BULK_STOCK_MATRIX_FAMILIES_PER_STOCK: ${STRATEGY_FACTORY_BULK_STOCK_MATRIX_FAMILIES_PER_STOCK:-3}
  STRATEGY_FACTORY_BULK_STOCK_MATRIX_MAX_TASKS_PER_RUN: ${STRATEGY_FACTORY_BULK_STOCK_MATRIX_MAX_TASKS_PER_RUN:-15000}
  STRATEGY_FACTORY_BULK_STOCK_MATRIX_MAX_CANDIDATES_PER_RUN: ${STRATEGY_FACTORY_BULK_STOCK_MATRIX_MAX_CANDIDATES_PER_RUN:-15000}
  STRATEGY_FACTORY_BULK_STOCK_MATRIX_GENERATION_LIMIT_PER_TASK: ${STRATEGY_FACTORY_BULK_STOCK_MATRIX_GENERATION_LIMIT_PER_TASK:-1}
  STRATEGY_FACTORY_BULK_BATCH_SIZE: ${STRATEGY_FACTORY_BULK_BATCH_SIZE:-100}
  STRATEGY_FACTORY_BULK_CONCURRENCY: ${STRATEGY_FACTORY_BULK_CONCURRENCY:-20}
  STRATEGY_FACTORY_BULK_STOCK_MATRIX_TASKS_PER_SHARD: ${STRATEGY_FACTORY_BULK_STOCK_MATRIX_TASKS_PER_SHARD:-24}
  STRATEGY_FACTORY_FACTOR_AUTO_REFRESH: ${STRATEGY_FACTORY_FACTOR_AUTO_REFRESH:-0}

services:
  # Dev 编排同样覆盖 Web / BFF / AKShare MCP / strategy-factory-worker / 基础设施。
  # 如需热重载，仍可继续使用 npm run dev:*；此文件优先保证完整容器栈可复现。

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: akshare-timescaledb
    shm_size: ${POSTGRES_CONTAINER_SHM_SIZE:-2gb}
    mem_limit: ${POSTGRES_CONTAINER_MEM_LIMIT:-4g}
    cpus: ${POSTGRES_CONTAINER_CPUS:-2.0}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1024MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-128MB}
      - -c
      - autovacuum_work_mem=${POSTGRES_AUTOVACUUM_WORK_MEM:-64MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-30}
      - -c
      - max_parallel_maintenance_workers=${POSTGRES_MAX_PARALLEL_MAINTENANCE_WORKERS:-1}
      - -c
      - max_parallel_workers=${POSTGRES_MAX_PARALLEL_WORKERS:-2}
      - -c
      - max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_WORKERS_PER_GATHER:-1}
      - -c
      - max_worker_processes=${POSTGRES_MAX_WORKER_PROCESSES:-8}
      - -c
      - timescaledb.max_background_workers=${POSTGRES_TIMESCALE_MAX_BACKGROUND_WORKERS:-4}
      - -c
      - huge_pages=${POSTGRES_HUGE_PAGES:-off}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockdb}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stockdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aiask-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  akshare-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: akshare-mcp
    image: ${AKSHARE_MCP_IMAGE:-aiask-akshare-mcp:local}
    container_name: akshare-mcp
    ports:
      - "${MCP_BIND_HOST:-127.0.0.1}:${MCP_PORT:-3100}:3100"
    environment:
      <<: *akshare-runtime-env
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-3100}
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-127.0.0.1}
      MCP_PUBLIC_PORT: ${MCP_PUBLIC_PORT:-3100}
      MCP_CONTAINER_BIND_ALL: "true"
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-bearer}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-local-dev-mcp-token}
      MCP_ALLOW_TOKEN_PASSTHROUGH: ${MCP_ALLOW_TOKEN_PASSTHROUGH:-false}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-127.0.0.1:3100,localhost:3100,akshare-mcp:3100}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      AKSHARE_MCP_STARTUP_PROFILE: ${AKSHARE_MCP_STARTUP_PROFILE:-worker}
      STRATEGY_FACTORY_ASYNC_WORKER_ENABLED: ${STRATEGY_FACTORY_ASYNC_WORKER_ENABLED:-true}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, socket; s=socket.create_connection(('127.0.0.1', int(os.getenv('MCP_PORT', '3100'))), 3); s.close()\"",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  strategy-factory-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: strategy-factory-worker
    image: ${STRATEGY_FACTORY_WORKER_IMAGE:-aiask-strategy-factory-worker:local}
    container_name: strategy-factory-worker
    environment:
      <<: *akshare-runtime-env
      STRATEGY_FACTORY_ASYNC_WORKER_ENABLED: "false"
      STRATEGY_FACTORY_WORKER_POLL_INTERVAL_SECONDS: ${STRATEGY_FACTORY_WORKER_POLL_INTERVAL_SECONDS:-2}
      STRATEGY_FACTORY_WORKER_SYNC_FACTORY_DISPATCH: ${STRATEGY_FACTORY_WORKER_SYNC_FACTORY_DISPATCH:-true}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: Dockerfile
      target: bff
    image: ${BFF_IMAGE:-aiask-bff:local}
    container_name: aiask-bff
    ports:
      - "${BFF_BIND_HOST:-0.0.0.0}:${BFF_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${BFF_NODE_ENV:-development}
      BFF_PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000,http://web:3000}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-dev-jwt-secret-change-me-32chars}
      APP_ACCESS_TOKEN_TTL_SECONDS: ${APP_ACCESS_TOKEN_TTL_SECONDS:-7200}
      APP_REFRESH_TOKEN_TTL_SECONDS: ${APP_REFRESH_TOKEN_TTL_SECONDS:-604800}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-local-admin-password}
      APP_ADMIN_PASSWORD_SYNC: ${APP_ADMIN_PASSWORD_SYNC:-if-mismatch}
      APP_ENABLE_DEMO_USER: ${APP_ENABLE_DEMO_USER:-true}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-demo123}
      APP_ENCRYPT_SECRET: ${APP_ENCRYPT_SECRET:-local-dev-encrypt-secret-32chars}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/${POSTGRES_DB:-stockdb}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_POOL_IDLE_TIMEOUT_MS: ${DATABASE_POOL_IDLE_TIMEOUT_MS:-30000}
      DATABASE_POOL_CONNECTION_TIMEOUT_MS: ${DATABASE_POOL_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_POOL_MAX_USES: ${DATABASE_POOL_MAX_USES:-0}
      DATABASE_POOL_APP_NAME: ${DATABASE_POOL_APP_NAME:-aiask-bff}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      CACHE_MEMORY_MAX_ENTRIES: ${CACHE_MEMORY_MAX_ENTRIES:-5000}
      CACHE_TTL_DEFAULT_SECONDS: ${CACHE_TTL_DEFAULT_SECONDS:-0}
      CACHE_TTL_OVERRIDES: ${CACHE_TTL_OVERRIDES:-{}}
      HTTP_THROTTLE_TTL_MS: ${HTTP_THROTTLE_TTL_MS:-60000}
      HTTP_THROTTLE_LIMIT: ${HTTP_THROTTLE_LIMIT:-600}
      MCP_TRANSPORT: streamable-http
      MCP_STREAMABLE_HTTP_URL: http://akshare-mcp:3100/mcp
      MCP_STREAMABLE_HTTP_HEADERS: "{\"authorization\":\"Bearer ${MCP_AUTH_TOKEN:-local-dev-mcp-token}\"}"
      MCP_STREAMABLE_HTTP_ALLOW_SSE_FALLBACK: ${MCP_STREAMABLE_HTTP_ALLOW_SSE_FALLBACK:-false}
      MCP_TRANSPORT_ALLOW_STDIO_FALLBACK: ${MCP_TRANSPORT_ALLOW_STDIO_FALLBACK:-false}
      MCP_STREAMABLE_HTTP_TIMEOUT_MS: ${MCP_STREAMABLE_HTTP_TIMEOUT_MS:-2500}
      MCP_EXPECTED_TOOLS: ${MCP_EXPECTED_TOOLS:-161}
      MCP_POOL_SIZE: ${MCP_POOL_SIZE:-4}
      MCP_POOL_ACQUIRE_TIMEOUT_MS: ${MCP_POOL_ACQUIRE_TIMEOUT_MS:-1500}
      MCP_WAIT_QUEUE_LIMIT: ${MCP_WAIT_QUEUE_LIMIT:-32}
      MCP_TOOL_TIMEOUT_MS: ${MCP_TOOL_TIMEOUT_MS:-8000}
      MCP_HEALTH_CACHE_TTL_MS: ${MCP_HEALTH_CACHE_TTL_MS:-10000}
      MCP_HEALTH_STALE_IF_ERROR_MS: ${MCP_HEALTH_STALE_IF_ERROR_MS:-120000}
      MCP_METRICS_WINDOW_SIZE: ${MCP_METRICS_WINDOW_SIZE:-120}
      MCP_DEDICATED_TOOLS: ${MCP_DEDICATED_TOOLS:-}
      MCP_TOOL_TIMEOUT_OVERRIDES: "${MCP_TOOL_TIMEOUT_OVERRIDES:-strategy_manager:5000,paper_trading_manager:4000,list_skills:2500,get_kline:8000,get_kline_data:8000}"
      MCP_TOOL_CIRCUIT_BREAKER_MS: ${MCP_TOOL_CIRCUIT_BREAKER_MS:-10000}
      MCP_STDIO_STARTUP_PROFILE: ${MCP_STDIO_STARTUP_PROFILE:-worker}
      AKSHARE_MCP_DB_POOL_MIN: ${AKSHARE_MCP_DB_POOL_MIN:-1}
      AKSHARE_MCP_DB_POOL_MAX: ${AKSHARE_MCP_DB_POOL_MAX:-2}
      BFF_HEALTH_PROBE_TIMEOUT_MS: ${BFF_HEALTH_PROBE_TIMEOUT_MS:-1500}
      MARKET_SCHEDULER_ENABLED: ${MARKET_SCHEDULER_ENABLED:-false}
      MARKET_INDEX_FAILURE_BACKOFF_MS: ${MARKET_INDEX_FAILURE_BACKOFF_MS:-30000}
      MARKET_INDEX_FAILURE_MAX_BACKOFF_MS: ${MARKET_INDEX_FAILURE_MAX_BACKOFF_MS:-120000}
      STRATEGY_MARKET_TIMEZONE: ${STRATEGY_MARKET_TIMEZONE:-Asia/Shanghai}
      STRATEGY_FACTORY_STATUS_SOURCE: ${STRATEGY_FACTORY_STATUS_SOURCE:-db}
      STRATEGY_FACTORY_STATUS_WARMUP_DELAY_MS: ${STRATEGY_FACTORY_STATUS_WARMUP_DELAY_MS:-20000}
      STRATEGY_FACTORY_RUN_TIMEOUT_MS: ${STRATEGY_FACTORY_RUN_TIMEOUT_MS:-240000}
      SKILL_RUN_TIMEOUT_MS: ${SKILL_RUN_TIMEOUT_MS:-120000}
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_TOKEN: ${NOTIFICATION_WEBHOOK_TOKEN:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-aiask-bff}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      akshare-mcp:
        condition: service_healthy
      strategy-factory-worker:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:'+(process.env.BFF_PORT||3001)+'/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: ${WEB_IMAGE:-aiask-web:local}
    container_name: aiask-web
    ports:
      - "${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      BFF_BASE_URL: ${WEB_INTERNAL_BFF_BASE_URL:-http://bff:3001/api}
      NEXT_PUBLIC_BFF_BASE_URL: ${NEXT_PUBLIC_BFF_BASE_URL:-http://localhost:3001/api}
      WS_URL: ${WEB_PUBLIC_WS_URL:-http://localhost:3001}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
      SENTRY_ORG: ${SENTRY_ORG:-}
      SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    depends_on:
      bff:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: akshare-pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@aiask.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    profiles: ["monitoring"]
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:latest}
    container_name: aiask-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_HEALTH_PORT:-13133}:13133"
    volumes:
      - ./monitoring/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  postgres-exporter:
    profiles: ["monitoring"]
    image: ${POSTGRES_EXPORTER_IMAGE:-quay.io/prometheuscommunity/postgres-exporter:latest}
    container_name: aiask-postgres-exporter
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@timescaledb:5432/${POSTGRES_DB:-stockdb}?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yml
    volumes:
      - ./monitoring/postgres-exporter-queries.yml:/etc/postgres-exporter/queries.yml:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  blackbox-exporter:
    profiles: ["monitoring"]
    image: ${BLACKBOX_EXPORTER_IMAGE:-prom/blackbox-exporter:latest}
    container_name: aiask-blackbox-exporter
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    ports:
      - "${BLACKBOX_EXPORTER_PORT:-9115}:9115"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped

  alertmanager:
    profiles: ["monitoring"]
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:latest}
    container_name: aiask-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  prometheus:
    profiles: ["monitoring"]
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: aiask-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
      - postgres-exporter
      - blackbox-exporter
    restart: unless-stopped

volumes:
  timescaledb-data:
    driver: local
    name: akshare-timescaledb-data
  redis-data:
    driver: local
    name: aiask-redis-data
  pgadmin-data:
    driver: local
    name: akshare-pgadmin-data
  prometheus-data:
    driver: local
    name: aiask-prometheus-data
  alertmanager-data:
    driver: local
    name: aiask-alertmanager-data
